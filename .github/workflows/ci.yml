name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build-and-prove:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4

      - name: Use .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Use stable Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Build and test Rust engine
        shell: pwsh
        run: |
          cargo fmt --manifest-path src/BehaviorDiff.Engine.Rust/Cargo.toml -- --check
          cargo clippy --manifest-path src/BehaviorDiff.Engine.Rust/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src/BehaviorDiff.Engine.Rust/Cargo.toml

      - name: Build and test Rust tracer
        shell: pwsh
        run: |
          cargo fmt --manifest-path src/BehaviorDiff.Rust.Tracer/Cargo.toml -- --check
          cargo clippy --manifest-path src/BehaviorDiff.Rust.Tracer/Cargo.toml --all-targets -- -D warnings
          cargo test --manifest-path src/BehaviorDiff.Rust.Tracer/Cargo.toml

      - name: Build .NET solution
        shell: pwsh
        run: dotnet build BehaviorDiff.sln -c Release --nologo

      - name: Verify contracts
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-contracts.ps1

      - name: Verify demo fixtures
        shell: pwsh
        run: pwsh -NoProfile -File tools/verify-demo-fixtures.ps1

      - name: Pack CLI tool with native binaries
        shell: pwsh
        run: pwsh -NoProfile -File tools/package-cli.ps1 -OutputDirectory artifacts/packages

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: behaviordiff-tool
          path: artifacts/packages/*.nupkg
