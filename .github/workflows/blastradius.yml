name: RealDiff blast radius

on:
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: read
  pull-requests: write

jobs:
  realdiff:
    runs-on: ubuntu-24.04
    env:
      REALDIFF_WORK: ${{ github.workspace }}/../realdiff-work
      REALDIFF_FINDINGS: ${{ github.workspace }}/.realdiff/artifacts/findings.json
      REALDIFF_GATE: warn-only
      REALDIFF_EXCLUDE_NAMESPACES: SampleApp.Diagnostics,SampleApp.Persistence,Infrastructure.Collections

    steps:
      - name: Check out complete history
        uses: actions/checkout@v4
        with:
          # RealDiff creates worktrees at github.event.pull_request.base.sha and head.sha and
          # calculates their merge base. The checkout action defaults to depth 1, which cannot work.
          fetch-depth: 0

      - name: Use .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.x

      - name: Build RealDiff CLI
        run: dotnet build src/RealDiff.Cli/RealDiff.Cli.csproj -c Release --nologo -v quiet

      - name: Analyze runtime behavior and measure
        id: analyze
        shell: bash
        run: |
          set +e
          mkdir -p "$(dirname "$REALDIFF_FINDINGS")"
          cli="$GITHUB_WORKSPACE/src/RealDiff.Cli/bin/Release/net8.0/realdiff.dll"
          metrics="$RUNNER_TEMP/realdiff-time.txt"
          stdout="$RUNNER_TEMP/realdiff.stdout.log"
          stderr="$RUNNER_TEMP/realdiff.stderr.log"

          /usr/bin/time -v -o "$metrics" \
            dotnet "$cli" "$GITHUB_WORKSPACE" --ci=github \
            --work "$REALDIFF_WORK" --findings "$REALDIFF_FINDINGS" \
            >"$stdout" 2>"$stderr"
          analysis_exit=$?
          cat "$stdout"
          cat "$stderr" >&2

          wall=$(awk -F': ' '/Elapsed \(wall clock\) time/{print $2}' "$metrics")
          peak_kb=$(awk -F': ' '/Maximum resident set size/{print $2}' "$metrics")
          trace_bytes=$(find "$REALDIFF_WORK" -type f -name '*.ndjson' ! -name '*manifest*' \
            -printf '%s\n' 2>/dev/null | awk '{s+=$1} END {print s+0}')

          echo "HOSTED MEASUREMENT wall=$wall peak_rss_kb=$peak_kb traces_bytes=$trace_bytes exit=$analysis_exit"
          {
            echo "### RealDiff hosted measurement"
            echo "- Wall clock: $wall"
            echo "- Peak RSS: $peak_kb KB"
            echo "- Trace bytes: $trace_bytes"
            echo "- Analysis exit: $analysis_exit"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "exit=$analysis_exit" >> "$GITHUB_OUTPUT"
          echo "wall=$wall" >> "$GITHUB_OUTPUT"
          echo "peak_rss_kb=$peak_kb" >> "$GITHUB_OUTPUT"
          echo "trace_bytes=$trace_bytes" >> "$GITHUB_OUTPUT"

          if [[ ! -f "$REALDIFF_FINDINGS" ]]; then
            cat > "$REALDIFF_FINDINGS" <<JSON
          {
            "schema": "realdiff.findings/1",
            "status": "failed",
            "verdict": "could_not_analyze",
            "isCleanResult": false,
            "exitCode": $analysis_exit,
            "exitReason": "analysis_process_failed_without_artifact",
            "refs": { "baseSha": null, "prSha": null, "mergeBaseSha": null },
            "refusal": { "reason": "RealDiff exited without findings.json. No safety verdict was produced; inspect the workflow logs." }
          }
          JSON
          fi

          # The posting step owns warn/fail gate semantics. Preserve every analysis state for it.
          exit 0

      - name: Post findings to pull request
        if: always() && github.event.pull_request.head.repo.fork == false
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          if [[ ! -f "$REALDIFF_FINDINGS" ]]; then
            echo "::error::findings.json is missing; no PR safety verdict or comment can be produced."
            exit 4
          fi
          dotnet src/RealDiff.Cli/bin/Release/net8.0/realdiff.dll post \
            --provider=github --findings "$REALDIFF_FINDINGS" --gate "$REALDIFF_GATE"

      - name: Upload machine-readable findings
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: realdiff-findings
          path: ${{ env.REALDIFF_FINDINGS }}
          if-no-files-found: error

      - name: Delete traces and worktrees
        if: always()
        shell: bash
        run: |
          before=$(du -sb "$REALDIFF_WORK" 2>/dev/null | cut -f1 || echo 0)
          rm -rf "$REALDIFF_WORK"
          echo "RealDiff cleanup removed $before bytes; findings.json was retained as an artifact."
