# Azure Repos does not honor YAML `pr` triggers. Attach this pipeline as a build validation policy
# on each target branch. The branch policy triggers the PR validation build.
trigger: none

pool:
  vmImage: ubuntu-24.04

variables:
  behaviorDiffImage: ghcr.io/issacnitin/realdiff:main
  behaviorDiffGate: warn-only
  behaviorDiffStrict: 'false'
  behaviorDiffWork: $(Agent.TempDirectory)/realdiff-work
  behaviorDiffCache: $(Pipeline.Workspace)/realdiff-cache
  behaviorDiffFindings: $(Build.ArtifactStagingDirectory)/realdiff/findings.json
  behaviorDiffExcludeNamespaces: SampleApp.Diagnostics,SampleApp.Persistence,Infrastructure.Collections

jobs:
  - job: realdiff
    displayName: RealDiff blast radius
    container:
      image: $(behaviorDiffImage)
      options: --entrypoint ""

    steps:
      - checkout: self
        clean: 'true'
        fetchDepth: '0'
        fetchTags: 'false'

      - bash: |
          set -euo pipefail
          git config --global --add safe.directory '*'
          mkdir -p "$(dirname '$(behaviorDiffFindings)')" '$(behaviorDiffCache)'

          args=('$(Build.Repository.LocalPath)' --ci=azuredevops
            --work '$(behaviorDiffWork)'
            --findings '$(behaviorDiffFindings)'
            --cache-dir '$(behaviorDiffCache)'
            --cache-retention 1d)
          if [[ '$(behaviorDiffStrict)' == 'true' ]]; then
            args+=(--strict)
          fi

          set +e
          REALDIFF_EXCLUDE_NAMESPACES='$(behaviorDiffExcludeNamespaces)' \
            realdiff "${args[@]}"
          analysis_exit=$?
          set -e

          echo "##vso[task.setvariable variable=behaviorDiffAnalysisExit]$analysis_exit"
          if [[ ! -f '$(behaviorDiffFindings)' ]]; then
            echo "##vso[task.logissue type=error]RealDiff exited $analysis_exit without findings.json."
            exit "$analysis_exit"
          fi

          if (( analysis_exit != 0 && analysis_exit != 1 )); then
            echo "##vso[task.logissue type=warning]RealDiff produced a non-verdict (exit $analysis_exit)."
          fi
        displayName: Analyze runtime behavior

      - bash: |
          set -euo pipefail
          realdiff post --provider=azuredevops \
            --findings '$(behaviorDiffFindings)' \
            --gate '$(behaviorDiffGate)'
        displayName: Post RealDiff findings to PR
        condition: always()
        env:
          SYSTEM_ACCESSTOKEN: $(System.AccessToken)

      - task: PublishPipelineArtifact@1
        displayName: Publish machine-readable findings
        condition: always()
        inputs:
          targetPath: $(Build.ArtifactStagingDirectory)/realdiff
          artifact: realdiff-findings

      - bash: |
          set -euo pipefail
          before=$(du -sb '$(behaviorDiffWork)' 2>/dev/null | cut -f1 || echo 0)
          rm -rf '$(behaviorDiffWork)'
          echo "RealDiff cleanup removed $before bytes; findings.json was retained."
        displayName: Delete traces and worktrees
        condition: always()