[package]
name = "behaviordiff-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha2 = "0.10"
time = { version = "0.3", features = ["formatting"] }

[[bin]]
name = "behaviordiff-engine"
path = "src/main.rs"
