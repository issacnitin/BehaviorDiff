[package]
name = "realdiff-rust-tracer"
version = "0.1.0"
edition = "2021"
publish = false

[workspace]
members = ["runtime"]

[[bin]]
name = "realdiff-rust-rewrite"
path = "src/main.rs"

[dependencies]
hex = "0.4"
pathdiff = "0.2"
prettyplease = "0.2"
proc-macro2 = { version = "1", features = ["span-locations"] }
quote = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
syn = { version = "2", features = ["full", "parsing", "printing", "visit-mut"] }
toml_edit = "0.22"
walkdir = "2"