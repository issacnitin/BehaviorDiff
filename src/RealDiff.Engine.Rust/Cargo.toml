[package]
name = "realdiff-engine"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
serde_yaml = "0.9"
sha2 = "0.10"
regex = "1"
time = { version = "0.3", features = ["formatting", "parsing"] }

[[bin]]
name = "realdiff-engine"
path = "src/main.rs"
